[package]
name = "glass-converter"
# Seule source du numéro de version : tauri.conf.json et package.json n'en déclarent pas.
version = "0.1.0"
description = "Glassmorphic Text Converter Desktop App"
authors = ["Odin"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RevanSpec/Converter"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "glass_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
idna = "1.1.0"
unicode-segmentation = "1.13.3"
htmlize = { version = "1.1.0", features = ["unescape"] }
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
proptest = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
