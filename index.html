<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glass Converter — Encodeur & Décodeur Universel</title>
    <!-- Polices Inter et JetBrains Mono embarquées (importées par main.ts) : aucune requête réseau -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Ambiance lumineuse d'arrière-plan pour le Glassmorphism -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="app-container">
      <!-- Barre d'en-tête de l'application -->
      <header class="app-header glass-card">
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>
          <div class="brand-text">
            <h1 class="brand-title">Glass Converter</h1>
            <span class="brand-subtitle">Encodeur &amp; Décodeur Universel</span>
          </div>
        </div>

        <!-- Badge de confidentialité stricte (Zéro historique) -->
        <div class="privacy-badge" title="Toutes les conversions sont traitées en mémoire vive. Aucun historique n'est stocké sur votre machine.">
          <span class="privacy-dot"></span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Zéro Historique • Éphémère</span>
        </div>

        <!-- Actions rapides globales -->
        <div class="header-actions">
          <button id="btn-example" class="btn-ghost" title="Insérer un texte d'exemple pour tester">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span>Exemple</span>
          </button>
          <button id="btn-clear-all" class="btn-ghost btn-danger-hover" title="Effacer tout">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Vider</span>
          </button>
        </div>
      </header>

      <!-- Sélecteur de format avec onglets Glassmorphism -->
      <nav class="formats-bar glass-card" aria-label="Formats de conversion">
        <div class="formats-scroll" id="formats-container">
          <button class="format-tab active" data-format="hex">
            <span class="tab-icon">⬡</span>
            <span class="tab-label">Hexadécimal</span>
          </button>
          <button class="format-tab" data-format="binary">
            <span class="tab-icon">01</span>
            <span class="tab-label">Binaire</span>
          </button>
          <button class="format-tab" data-format="base64">
            <span class="tab-icon">B64</span>
            <span class="tab-label">Base64</span>
          </button>
          <button class="format-tab" data-format="base32">
            <span class="tab-icon">B32</span>
            <span class="tab-label">Base32</span>
          </button>
          <button class="format-tab" data-format="morse">
            <span class="tab-icon">•−</span>
            <span class="tab-label">Code Morse</span>
          </button>
          <button class="format-tab" data-format="url">
            <span class="tab-icon">%20</span>
            <span class="tab-label">URL Encode</span>
          </button>
          <button class="format-tab" data-format="caesar">
            <span class="tab-icon">ROT</span>
            <span class="tab-label">ROT13 / César</span>
          </button>
          <button class="format-tab" data-format="html">
            <span class="tab-icon">&amp;;</span>
            <span class="tab-label">HTML Entities</span>
          </button>
          <button class="format-tab" data-format="asciidec">
            <span class="tab-icon">#10</span>
            <span class="tab-label">ASCII Décimal</span>
          </button>
          <button class="format-tab" data-format="asciioct">
            <span class="tab-icon">#08</span>
            <span class="tab-label">ASCII Octal</span>
          </button>
          <button class="format-tab" data-format="reverse">
            <span class="tab-icon">⇄</span>
            <span class="tab-label">Inversion</span>
          </button>
          <button class="format-tab" data-format="punycode">
            <span class="tab-icon">xn--</span>
            <span class="tab-label">Punycode (IDN)</span>
          </button>
        </div>
      </nav>

      <!-- Barre d'options contextuelle liée au format sélectionné -->
      <section class="options-bar glass-card" id="options-bar">
        <!-- Options Hexadécimal -->
        <div class="options-group" id="opts-hex">
          <label class="opt-label">Séparateur :</label>
          <div class="segmented-control">
            <button class="segment active" data-hex-sep=" ">Espace</button>
            <button class="segment" data-hex-sep="">Continu</button>
            <button class="segment" data-hex-sep="0x">0x...</button>
            <button class="segment" data-hex-sep=":">Deux-points (:)</button>
          </div>
          <div class="toggle-control">
            <label class="checkbox-container">
              <input type="checkbox" id="hex-uppercase" />
              <span class="checkmark"></span>
              <span class="checkbox-text">Majuscules</span>
            </label>
          </div>
        </div>

        <!-- Options Binaire -->
        <div class="options-group hidden" id="opts-binary">
          <label class="opt-label">Format des octets :</label>
          <div class="segmented-control">
            <button class="segment active" data-bin-spaced="true">Groupes de 8 bits</button>
            <button class="segment" data-bin-spaced="false">Séquence continue</button>
          </div>
        </div>

        <!-- Options Base64 -->
        <div class="options-group hidden" id="opts-base64">
          <label class="opt-label">Mode d'encodage :</label>
          <div class="segmented-control">
            <button class="segment active" data-b64-url="false">Standard (RFC 4648)</button>
            <button class="segment" data-b64-url="true">URL Safe (-_)</button>
          </div>
        </div>

        <!-- Options César / ROT13 -->
        <div class="options-group hidden" id="opts-caesar">
          <label class="opt-label" for="caesar-shift-slider">Décalage César :</label>
          <div class="slider-container">
            <input type="range" id="caesar-shift-slider" min="1" max="25" value="13" />
            <span class="slider-badge" id="caesar-shift-val">+13 (ROT13)</span>
          </div>
          <button class="btn-micro" id="btn-caesar-reset">Réinitialiser (13)</button>
        </div>

        <!-- Options Morse -->
        <div class="options-group hidden" id="opts-morse">
          <button class="btn-sound" id="btn-play-morse" title="Écouter la transcription sonore du code Morse">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <span id="morse-sound-label">Écouter le Morse (Bips audio)</span>
          </button>
          <label class="opt-label">Caractères sans code :</label>
          <div class="segmented-control">
            <button class="segment" data-morse-unknown="error">Erreur</button>
            <button class="segment active" data-morse-unknown="transliterate">Translittérer (à → A)</button>
            <button class="segment" data-morse-unknown="ignore">Ignorer</button>
          </div>
        </div>

        <!-- Options Punycode -->
        <div class="options-group hidden" id="opts-punycode">
          <label class="opt-label">Format de sortie :</label>
          <div class="segmented-control">
            <button class="segment active" data-puny-prefix="true">Préfixe xn-- (Standard IDN)</button>
            <button class="segment" data-puny-prefix="false">Punycode brut (RFC 3492)</button>
          </div>
        </div>

        <!-- Options par défaut génériques pour les autres formats -->
        <div class="options-group hidden" id="opts-generic">
          <span class="generic-hint">Conversion instantanée bidirectionnelle en temps réel</span>
        </div>
      </section>

      <!-- Zone d'erreur glassmorphism subtile -->
      <div class="error-banner glass-card hidden" id="error-banner">
        <div class="error-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div class="error-message" id="error-text">Message d'erreur</div>
      </div>

      <!-- Espace de travail : Panneau double de conversion -->
      <main class="converter-workspace">
        <!-- Panneau Source -->
        <div class="panel-card glass-card" id="source-card">
          <div class="panel-header">
            <div class="panel-title-group">
              <span class="panel-indicator source-indicator"></span>
              <h2 class="panel-title" id="source-title">Texte en clair</h2>
              <span class="badge-role" id="source-role-badge">Entrée</span>
            </div>
            <div class="panel-actions">
              <button class="btn-panel-action" id="btn-paste-source" title="Coller depuis le presse-papier">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                  <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
                <span>Coller</span>
              </button>
              <button class="btn-panel-action btn-danger-hover" id="btn-clear-source" title="Effacer la saisie">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="panel-body">
            <textarea
              id="source-input"
              class="editor-textarea"
              placeholder="Tapez ou collez votre texte ici..."
              spellcheck="false"
            ></textarea>
          </div>

          <div class="panel-footer">
            <div class="stats-group">
              <span id="source-char-count">0</span> car.
              <span class="stats-separator">•</span>
              <span id="source-byte-count">0</span> octets UTF-8
            </div>
            <div class="editor-hint">Saisie en direct</div>
          </div>
        </div>

        <!-- Séparateur central avec Bouton d'inversion des sens -->
        <div class="swap-divider">
          <div class="divider-line"></div>
          <button id="btn-swap-direction" class="btn-swap glass-card" title="Inverser le sens de conversion (Texte ⇄ Encodé)">
            <svg class="swap-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
          </button>
          <div class="divider-line"></div>
        </div>

        <!-- Panneau Résultat / Destination -->
        <div class="panel-card glass-card" id="target-card">
          <div class="panel-header">
            <div class="panel-title-group">
              <span class="panel-indicator target-indicator"></span>
              <h2 class="panel-title" id="target-title">Hexadécimal</h2>
              <span class="badge-role" id="target-role-badge">Résultat</span>
            </div>
            <div class="panel-actions">
              <button class="btn-panel-action btn-highlight" id="btn-copy-target" title="Copier le résultat">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span id="copy-btn-text">Copier</span>
              </button>
            </div>
          </div>

          <div class="panel-body">
            <textarea
              id="target-output"
              class="editor-textarea readonly"
              readonly
              placeholder="Le résultat de la conversion apparaîtra ici..."
              spellcheck="false"
            ></textarea>
          </div>

          <div class="panel-footer">
            <div class="stats-group">
              <span id="target-char-count">0</span> car.
              <span class="stats-separator">•</span>
              <span id="target-byte-count">0</span> octets
            </div>
            <div class="conversion-status" id="conversion-status">
              <span class="status-pulse"></span> Prêt
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Notification Toast Glassmorphism -->
    <div class="toast-container" id="toast-container">
      <div class="toast glass-card" id="toast">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="toast-text">Copié dans le presse-papier !</span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
