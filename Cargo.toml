[workspace]
members = ["crates/converter-core", "src-tauri"]
resolver = "2"

[workspace.package]
# Seule source du numéro de version : les crates en héritent, Tauri le reprend,
# tauri.conf.json et package.json n'en déclarent pas.
version = "0.3.0"
authors = ["Odin"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RevanSpec/Converter"
edition = "2021"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
